name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, flutter-mobile ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android --org ru.sverkapro --project-name sverka_pro

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sverka-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
